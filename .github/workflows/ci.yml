name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-gate:
    name: Sink reliability gate
    if: always()
    needs: [repository, test, unit-benchmarks, image, release-assets, qualification]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | length > 0 and all(.[]; .value.result == "success")' <<< "$RESULTS"

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GitHub Actions workflows
        run: make lint-workflows

      - name: Check local documentation links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            '*.md' 'configs/*.md' 'docs/**/*.md' 'examples/**/*.md' '.github/*.md'
          output: /tmp/sink-doc-links.md
          fail: true

  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make check-format

      - name: Run race tests
        run: make test-coverage

      - name: Preserve unit coverage and test events
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: .reports/coverage/
          include-hidden-files: true
          retention-days: 14

      - name: Run lint and enforce unit-test ownership
        run: make lint

  unit-benchmarks:
    name: Unit fuzzing and microbenchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz malformed envelope and BSON inputs
        run: make fuzz-unit
      - name: Exercise component microbenchmarks
        run: make benchmark-unit BENCHTIME=1x
      - name: Preserve unit fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-fuzz-evidence
          path: .reports/fuzz/
          include-hidden-files: true
          retention-days: 14

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-assets:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release-note rendering
        run: scripts/test-render-release-notes.sh

      - name: Build cross-platform archives
        run: scripts/build-release-binaries.sh ci dist

  qualification:
    name: External test suite
    uses: batchstream/sink-production-suite/.github/workflows/server-qualification.yml@c57026b4a2a31937b98960756c8401e77446522c
    with:
      suite_ref: c57026b4a2a31937b98960756c8401e77446522c
      sink_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_ref: ${{ github.head_ref || 'main' }}
