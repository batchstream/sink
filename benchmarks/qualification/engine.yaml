mode: engine
health: {address: ":8081"}
prometheus: {enabled: true, address: ":9090"}
storage:
  name: mongo
  driver: mongodb
  mongodb:
    uri: mongodb://mongo:27017/?replicaSet=rs0
service:
  request:
    max_read_bytes: 4MiB
    timeout: 5s
  execution:
    max_bytes: 128MiB
  batching:
    max_wait: 2ms
  merge:
    max_attempts: 50
shutdown_timeout: 10s
