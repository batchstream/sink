mode: server

grpc:
  address: ":8080"
  max_receive_message_bytes: 67108864
  max_send_message_bytes: 67108864

prometheus:
  address: ":9090"

storages:
  - name: primary
    driver: mongodb
    mongodb:
      uri: mongodb://mongodb:27017
      metadata_field: __sink
      max_concurrent_writes: 64
      max_concurrent_groups: 16
    # Optional ceiling within service.execution.max_bytes.
    # limits:
    #   max_execution_bytes: 134217728

service:
  request:
    timeout: 30s
    max_read_bytes: 33554432
    max_operations: 1000
  execution:
    max_requests: 128
    max_bytes: 268435456
    max_requests_per_store: 32
    scan:
      admission_wait: 2s
  publish:
    max_requests_per_store: 32
    max_requests: 32
    max_bytes: 268435456
  batching:
    max_wait: 2ms
    max_operations: 1000
    max_bytes: 16777216
    queue:
      max_operations: 10000
      max_bytes: 134217728
  merge:
    max_attempts: 3
    lua:
      timeout: 100ms
      max_source_bytes: 65536
      max_result_bytes: 16777216
      max_cached_programs: 256
      max_instructions: 1000000

shutdown_timeout: 15s
