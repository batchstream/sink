# Gateway: route public RPCs to per-Store Engines; no database or Kafka configuration.
# Values are defaults unless marked as examples or derived defaults.
# Capacities are per process, not cluster-wide or hard RSS limits.
# Byte sizes accept KiB/MiB/GiB or integer bytes; durations accept ms/s/m/h.
# Positive limits cannot be disabled with 0. Unknown fields are rejected.
# Validate offline: sink config check --config config.gateway.example.yaml
# Keep routes.example.yaml alongside this file, or change gateway.routes_file.
mode: gateway # Required process role.

# Public RPC and gRPC health listener.
grpc:
  address: ":8080" # TCP listen address.
  max_receive_message_bytes: 64MiB # Maximum encoded inbound gRPC message.
  max_send_message_bytes: 64MiB # Maximum encoded outbound gRPC message.

# Optional HTTP metrics and health listener.
prometheus:
  address: ":9090" # Example; default empty disables /metrics, /livez, /readyz.

# Per-public-request limits, retained across all forwarded Store groups.
service:
  # Per-original-request limits, including requests split/coalesced by Gateway/Engine.
  request:
    timeout: 30s # Overall unary/page deadline including waits; <=300s; caller may shorten.
    max_read_bytes: 32MiB # Read/returned-write/native document budget; <=half gRPC send limit.
    max_operations: 1000 # Maximum operations in one Read, Write, or Delete request.

gateway: # Stateless routing, bounded forwarding, and lazy downstream connections.
  routes_file: routes.example.yaml # Required; relative to this config file's directory.
  reload_interval: 5s # Poll interval for atomic route-file replacements.
  dns_refresh_interval: 30s # Refresh DNS-backed Engine replica addresses.
  idle_timeout: 5m # Evict unused downstream channels after this idle duration.
  max_connections: 256 # Cached downstream channels; <=10000; active calls protected.
  max_requests: 128 # Concurrent public Gateway requests; maximum 10000.
  max_requests_per_store: 32 # Default min(32, max_requests); per-Store forwarding cap.
  max_bytes: 256MiB # Input/envelope/response reservations; maximum 1TiB.
  max_fanout: 8 # Concurrent Store groups per RPC; <=128; budget-sensitive groups serialize.

shutdown_timeout: 15s # Grace period for draining public RPCs and closing connections.
