# Engine: synchronous RPC execution and optional Kafka publication for one Store.
# Values are defaults unless marked as examples or derived defaults.
# Capacities are per process, not cluster-wide or hard RSS limits.
# Byte sizes accept KiB/MiB/GiB or integer bytes; durations accept ms/s/m/h.
# Positive limits cannot be disabled with 0. Unknown fields are rejected.
# Validate offline: sink config check --config configs/engine.yaml
# See ../docs/configuration.md for constraints and supported storage drivers.
mode: engine # Required process role.

# Public RPC and gRPC health listener.
grpc:
  address: ":8080" # TCP listen address.
  max_receive_message_bytes: 64MiB # Maximum encoded inbound gRPC message.
  max_send_message_bytes: 64MiB # Maximum encoded outbound gRPC message.

# Optional HTTP metrics and health listener.
prometheus:
  enabled: false # Opt in to the HTTP /metrics, /livez, and /readyz endpoints; default false.
  address: ":9090" # HTTP listen address, used only when enabled; default :9090.

# Bind this process to one Store. Its replicas must use the same Store name.
storage:
  name: primary # Required globally unique Store name; shared by all its replicas.
  driver: mongodb # Required: mongodb, elasticsearch, or opensearch.

  # MongoDB driver settings. Replace with the search block for a search driver.
  mongodb:
    uri: mongodb://mongodb:27017 # Example; required MongoDB connection URI.
    metadata_field: __sink # Internal revision field; hidden from returned documents.
    max_concurrent_writes: 64 # Concurrent conditional MongoDB writes per process.
    max_concurrent_groups: 16 # Concurrent collection groups shared by all calls.

  # Search driver alternative: set driver to elasticsearch or opensearch above.
  # search: # Backend endpoints and authentication for this Store only.
  #   endpoints: [http://opensearch:9200] # Example; at least one endpoint required.
  #   username: "" # Basic-auth user; configure together with password.
  #   password: "" # Basic-auth password; use deployment-managed secret values.
  #   api_key: "" # API key alternative; cannot be combined with basic auth.

  # Optional asynchronous publication; enable it when deploying a Worker.
  kafka:
    enabled: false # Set true to accept asynchronous mutations; default false.
    brokers: [kafka:9092] # Example bootstrap addresses; required when enabled.
    # Source topic policy. Matching Engine/Worker replicas must use the same policy.
    topic:
      name: primary-mutations # Example; required when Kafka is enabled.
      partitions: 4 # Exact source/DLQ partition count; changes need a drained migration.
      replication_factor: 2 # Replicas per partition; requires enough Kafka brokers.
      retention: 72h # Source topic retention; must be at least 1ms.
      min_insync_replicas: 2 # Default min(2, replication_factor); cannot exceed it.
      max_record_bytes: 900KiB # Encoded mutation plus key; <= producer buffer, <=64MiB.
    # Buffer capacity for asynchronous mutation publication.
    producer:
      max_buffered_bytes: 64MiB # Additional to service budgets; maximum 1GiB.
    # Engine reconciles DLQ policy; Worker delivers permanent failures there.
    dead_letter:
      topic: primary-mutations.dlq # Default <topic.name>.dlq; must differ from source.
      retention: 720h # Independent DLQ retention (30 days); at least 1ms.

# Request handling, synchronous execution, asynchronous publishing, and Lua.
service:
  # Per-original-request limits, including requests split/coalesced by Gateway/Engine.
  request:
    timeout: 30s # Overall unary/page deadline including waits; <=300s; caller may shorten.
    max_read_bytes: 32MiB # Read/returned-write/native document budget; <=half gRPC send limit.
    max_operations: 1000 # Maximum operations in one Read, Write, or Delete request.

  # Storage execution for all synchronous methods, not only the Execute RPC.
  execution:
    max_requests: 128 # Concurrent admitted execution requests; maximum 10000.
    max_bytes: 256MiB # Admitted input/output reservations; <=16GiB; not a heap/RSS cap.
    # Waiting direct synchronous calls; separate from batching and Scan queues.
    queue:
      max_requests: 1024 # Pending direct requests; maximum 10000.
      max_bytes: 32MiB # Waiting input/bookkeeping; default min(32MiB, execution.max_bytes).
      max_wait: 2s # Default min(2s, request.timeout); cannot exceed request.timeout.
    # Scan pages also consume the total execution capacity above.
    scan:
      max_requests: 64 # Default max(1, execution.max_requests/2); <= execution.max_requests.
      max_bytes: 128MiB # Default max(1, execution.max_bytes/2); <= execution.max_bytes.
      admission_wait: 2s # Default min(2s, request.timeout); included in page deadline.

  # Engine asynchronous Write/Delete admission; independent of storage execution.
  publish:
    max_requests: 32 # Concurrent publishing requests; maximum 10000.
    max_bytes: 256MiB # Publication reservations; <=16GiB; Kafka buffers are additional.

  # Engine Read/Write/Delete batching is always active; these are collection targets.
  batching:
    max_wait: 2ms # Collection delay starting with the first request in a batch.
    max_operations: 1000 # Default request.max_operations; cannot exceed that limit.
    max_bytes: 16MiB # Encoded batch target; a larger valid single RPC can run alone.
    # Separate bounded queue for each batched method: Read, Write, and Delete.
    queue:
      max_operations: 10000 # Default max(10000, request.max_operations); >= batch target.
      max_bytes: 128MiB # Default max(128MiB, grpc receive limit); >= receive/batch limits.

  # Conditional mutation conflict handling and Lua limits, shared by Engine/Worker.
  merge:
    max_attempts: 3 # Revision-conflict attempts for Merge and folded conditional Put.
    lua:
      timeout: 100ms # Maximum wall-clock time per Lua execution.
      max_source_bytes: 64KiB # Maximum Lua program source bytes.
      max_result_bytes: 16MiB # Current/input/result document bound, including expansion.
      max_cached_programs: 256 # Compiled programs retained in this process's LRU cache.
      max_instructions: 1000000 # Maximum VM instruction checkpoints per execution.

shutdown_timeout: 15s # Grace period for RPC shutdown and database disconnect.
