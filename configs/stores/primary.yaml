# Shared Store identity and dependency policy. Pass with --store-config.
# This file is reused by Engine and Worker; restart both after policy changes.
name: primary
storage:
  driver: mongodb # mongodb, elasticsearch, or opensearch.
  mongodb:
    uri: mongodb://mongodb:27017 # Example endpoint; required unless uri_file is set.
    # uri_file: /etc/sink-secrets/mongodb-uri # Omit uri when using its file alternative.
    metadata_field: __sink # Must match across roles and replicas.
    max_concurrent_writes: 64 # Per process; shared by Engine and Worker configuration.
    max_concurrent_groups: 16
  # For elasticsearch/opensearch, replace mongodb with search:
  # search:
  #   endpoints: [http://opensearch:9200]
  #   username_file: /etc/sink-secrets/search-username
  #   password_file: /etc/sink-secrets/search-password
  #   api_key_file: /etc/sink-secrets/search-api-key # Alternative to basic auth.
kafka:
  enabled: true # Disable for synchronous-only Stores; Worker requires true.
  brokers: [kafka:9092]
  # Shared by the source and dead-letter Topics.
  partitions: 4
  replication_factor: 2
  min_insync_replicas: 1
  max_record_bytes: 900KiB
  topic:
    name: primary-mutations
    retention: 72h
  dead_letter:
    name: primary-mutations.dlq # Defaults to <topic.name>.dlq.
    retention: 720h
