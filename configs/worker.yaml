# Worker: consume and apply Kafka mutations for one Store; no business gRPC listener.
# Values are defaults unless marked as examples or derived defaults.
# Capacities are per process, not cluster-wide or hard RSS limits.
# Byte sizes accept KiB/MiB/GiB or integer bytes; durations accept ms/s/m/h.
# Positive limits cannot be disabled with 0. Unknown fields are rejected.
# Validate offline: sink config check --config configs/worker.yaml
# Engine must enable Kafka to publish mutations for this Worker.
mode: worker # Required process role.

# One shared process pool; max_bytes is normally detected automatically.
memory:
  # max_bytes: 256MiB # Optional explicit capacity, including completion reserve.
  burst_percent: 10 # Completion reserve; 1..99; new requests use ordinary capacity.
  wait_timeout: 2s # Response growth wait, bounded by the original request deadline.

# Dedicated health listener; always available independently of Prometheus.
health:
  address: ":8081" # Listen address for /livez and /readyz; default :8081.

# Separate optional Prometheus listener.
prometheus:
  enabled: false # Start /metrics on its own port; does not affect health; default false.
  address: ":9090" # Metrics-only listen address, used only when enabled; default :9090.

# Bind this process to one Store. Its replicas must use the same Store name.
storage:
  name: primary # Required globally unique Store name; shared by all its replicas.
  driver: mongodb # Required: mongodb, elasticsearch, or opensearch.

  # MongoDB driver settings. Replace with the search block for a search driver.
  mongodb:
    uri: mongodb://mongodb:27017 # Example; required MongoDB connection URI.
    metadata_field: __sink # Internal revision field; hidden from returned documents.
    max_concurrent_writes: 64 # Concurrent conditional MongoDB writes per process.
    max_concurrent_groups: 16 # Concurrent collection groups shared by all calls.

  # Search driver alternative: set driver to elasticsearch or opensearch above.
  # search: # Backend endpoints and authentication for this Store only.
  #   endpoints: [http://opensearch:9200] # Example; at least one endpoint required.
  #   username: "" # Basic-auth user; configure together with password.
  #   password: "" # Basic-auth password; use deployment-managed secret values.
  #   api_key: "" # API key alternative; cannot be combined with basic auth.

  # Kafka consumption is required; match the Engine Store, backend, and topic policy.
  kafka:
    enabled: true # Required in Worker mode; no default consumer without Kafka.
    brokers: [kafka:9092] # Example bootstrap addresses; required when enabled.
    # Source topic policy. Matching Engine/Worker replicas must use the same policy.
    topic:
      name: primary-mutations # Example; required when Kafka is enabled.
      partitions: 4 # Exact source/DLQ partition count; changes need a drained migration.
      replication_factor: 2 # Replicas per partition; requires enough Kafka brokers.
      retention: 72h # Source topic retention; must be at least 1ms.
      min_insync_replicas: 2 # Default min(2, replication_factor); cannot exceed it.
      max_record_bytes: 900KiB # Encoded mutation plus key; <= producer buffer, <=64MiB.
    # Consumption and retry settings for this Store.
    consumer:
      group_id: primary-workers # Example; required for Worker, default empty.
      max_poll_records: 500 # Maximum records handled in one fetched batch.
      processing_timeout: 20s # Backend time per batch; <=20s, plus bounded settlement.
      # Temporary failures remain pending after a round; attempts do not discard them.
      retry:
        max_attempts: 10 # Attempts per processing round, not a message lifetime limit.
        backoff: 100ms # Initial retry delay before jitter.
        max_backoff: 10s # Delay cap before jitter; must be >= backoff.
    # Permanent, malformed, and wrong-Store messages go to the dead-letter topic.
    dead_letter:
      topic: primary-mutations.dlq # Default <topic.name>.dlq; must differ from source.
      retention: 720h # Independent DLQ retention (30 days); at least 1ms.

# Limits for synchronous application of consumed mutations and Lua execution.
service:
  # Limits per execution call made by the consumer.
  request:
    timeout: 30s # Execution deadline; consumer.processing_timeout may shorten it.
    max_read_bytes: 32MiB # Merge snapshot/output budget per execution call; default 32MiB.
    max_operations: 1000 # Caps consumer poll records and operations in each execution call.

  # Conditional mutation conflict handling and Lua limits.
  merge:
    max_attempts: 3 # Revision-conflict attempts for Merge and folded conditional Put.
    lua:
      timeout: 100ms # Maximum wall-clock time per Lua execution.
      max_source_bytes: 64KiB # Maximum Lua program source bytes.
      max_result_bytes: 16MiB # Current/input/result document bound, including expansion.
      max_cached_programs: 256 # Compiled programs retained in this process's LRU cache.
      max_instructions: 1000000 # Maximum VM instruction checkpoints per execution.

shutdown_timeout: 15s # Grace period for consumer shutdown and database disconnect.

# Internal diagnostics; restart the process after changes. See ../docs/logging.md.
logging:
  level: warn # Minimum severity for all components: debug, info, warn, error; default warn.
  console: # Standard error output; no log files.
    enabled: true # Default true; console or OTLP must remain enabled.
    format: text # text or json; default text; does not change OTLP encoding.

  # Optional deployment labels; only these keys are allowed, each <=256 UTF-8 bytes on one line.
  # Nonempty values override the matching environment-derived identity.
  labels:
    environment: "" # Deployment environment, e.g. production; default empty.
    cluster: "" # Deployment cluster name, e.g. example-eks; default empty.
    namespace: "" # Kubernetes namespace; empty uses POD_NAMESPACE, not a database namespace.
    pod: "" # Pod name; empty uses POD_NAME.
    node: "" # Node name; empty uses NODE_NAME.

  failure_body: false # Include document content in supported final ERROR logs; default false.
  max_body_bytes: 16KiB # Failure-body limit including message/truncation marker; 1KiB..64KiB.

  # Optional direct export to an existing OpenTelemetry Collector; disabled by default.
  # Export is asynchronous; Collector outages do not block startup or affect readiness.
  otlp:
    enabled: false # Enable direct OTLP log export; requires endpoint; default false.
    protocol: grpc # grpc or http/protobuf; default grpc; HTTP sends to /v1/logs.
    endpoint: "" # Required when enabled: host:port, without scheme/path/auth; default empty.
    # Example endpoint: otel-collector.observability.svc.cluster.local:4317 (HTTP usually 4318).
    tls: # Transport security for the Collector connection.
      enabled: true # Verify hostname/system CA trust; false selects plaintext; default true.
    queue_size: 1024 # Pending log records; 1..8192; overflow discards older records.
    batch_size: 128 # Records per export; 1..512 and <=queue_size; default 128.
    flush_interval: 1s # Export interval; >0 and <=1m; default 1s.
    export_timeout: 3s # Per-export deadline including retries; >0 and <=30s; default 3s.
    shutdown_timeout: 5s # Extra log-flush grace after application cleanup; >0 and <=30s.
