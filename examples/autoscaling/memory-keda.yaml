# Install KEDA and scrape Sink /metrics first. Adjust namespace, Deployment and
# Prometheus job selectors together; every query must cover exactly one fleet.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sink-gateway-memory
  namespace: sink
spec:
  scaleTargetRef:
    name: sink-gateway
  minReplicaCount: 2
  maxReplicaCount: 12
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: prometheus
      metricType: Value # Fleet ratio: do not divide by replicas again.
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        threshold: "0.75"
        ignoreNullValues: "false"
        query: >-
          (
            sum(sink_memory_used_bytes{namespace="sink",job="sink-gateway",role="gateway"})
            / sum(sink_memory_watermark_bytes{namespace="sink",job="sink-gateway",role="gateway",watermark="high"})
          )
          and on() (min(up{namespace="sink",job="sink-gateway"}) == 1)
          and on() (count(sink_memory_watermark_bytes{namespace="sink",job="sink-gateway",role="gateway",watermark="high"})
                    == count(up{namespace="sink",job="sink-gateway"}))
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        threshold: "0.02"
        ignoreNullValues: "false"
        query: >-
          (
            sum(rate(sink_memory_rejected_total{namespace="sink",job="sink-gateway",role="gateway"}[1m]))
            / clamp_min(
              sum(rate(sink_memory_admitted_total{namespace="sink",job="sink-gateway",role="gateway"}[1m]))
              + sum(rate(sink_memory_rejected_total{namespace="sink",job="sink-gateway",role="gateway"}[1m])), 1)
          )
          and on() (min(up{namespace="sink",job="sink-gateway"}) == 1)
