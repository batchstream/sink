# Engine component configuration. Mount store.yaml from your configuration Secret.
mode: engine
grpc: {address: ":8080", max_receive_message_bytes: 64MiB, max_send_message_bytes: 64MiB}
health: {address: ":8081"}
prometheus: {enabled: true, address: ":9090"}
execution:
  mongodb: {max_concurrent_writes: 64, max_concurrent_groups: 16}
  merge: {max_attempts: 3}
batching:
  max_wait: 2ms
  max_operations: 32
  max_bytes: 16MiB
  queue: {max_operations: 10000, max_bytes: 64MiB}
shutdown_timeout: 30s
