# This is a template. Supply real backend configuration through your Secret
# management system. Sink reads this file directly; it does not expand ${ENV}.
mode: engine
grpc:
  address: :8080
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 64MiB
prometheus:
  address: :9090
storage:
  name: mongo
  driver: mongodb
  mongodb:
    uri: mongodb://mongo-0.example.invalid:27017,mongo-1.example.invalid:27017,mongo-2.example.invalid:27017/?replicaSet=rs0
    max_concurrent_writes: 64
    max_concurrent_groups: 16
service:
  request:
    timeout: 10s
    # Small-document deployments can use 8388608 after validating aggregate
    # per-RPC snapshot/result sizes; see docs/production-sizing.md.
    max_read_bytes: 32MiB
    max_operations: 1000
  execution:
    max_requests: 128
    max_bytes: 512MiB
  batching:
    max_wait: 2ms
    max_operations: 32
    max_bytes: 16MiB
    queue:
      max_operations: 10_000
      max_bytes: 64MiB
  merge:
    max_attempts: 3
    lua:
      timeout: 100ms
      max_source_bytes: 64KiB
      max_result_bytes: 16MiB
      max_cached_programs: 256
      max_instructions: 1_000_000

shutdown_timeout: 30s
