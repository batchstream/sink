mode: engine
grpc:
  address: ":8080"
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 64MiB
memory:
  # max_bytes: 256MiB # Omit to auto-detect managed capacity; not an RSS cap.
  burst_percent: 10 # Completion reserve, 1..99.
  wait_timeout: 2s # Memory-growth contention bound; never an overall RPC deadline.
batching:
  max_wait: 2ms # Collection delay, not an execution timeout.
  max_operations: 32 # Measured small-document starting point; not the public RPC limit.
  max_bytes: 16MiB
  queue:
    max_operations: 10000
    max_bytes: 128MiB
producer:
  max_buffered_bytes: 64MiB
execution:
  max_snapshot_bytes: 32MiB # Conditional-write snapshots, accumulated per execution owner.
  max_output_bytes: 32MiB # Candidate documents, accumulated separately from snapshots.
  mongodb: # Only valid with the mongodb driver; tune independently in each role.
    max_concurrent_writes: 64
    max_concurrent_groups: 16
  merge:
    max_attempts: 3 # Revision-conflict attempts.
    lua:
      timeout: 100ms # Per-script execution protection, not an RPC deadline.
      max_source_bytes: 64KiB
      max_result_bytes: 16MiB # Per-document current/input/result bound.
      max_cached_programs: 256
      max_instructions: 1000000

health:
  address: ":8081"
prometheus:
  enabled: true
  address: ":9090"
shutdown_timeout: 15s
logging: {level: warn}
