mode: gateway
grpc:
  address: ":8080"
  max_receive_message_bytes: 64MiB
  max_send_message_bytes: 64MiB
memory:
  # max_bytes: 256MiB # Omit to auto-detect managed capacity; not an RSS cap.
  burst_percent: 10 # Completion reserve, 1..99.
  wait_timeout: 2s # Memory-growth contention bound; never an overall RPC deadline.
request:
  max_operations: 1000 # Entire client request across all Stores.
forwarding:
  routes:
    - store: primary
      target: dns:///engine:8080
      tls:
        insecure: true # Example trusted plaintext network.
        server_name: ""
  dns_refresh_interval: 30s
  idle_timeout: 5m
  max_connections: 256
  max_fanout: 8

health:
  address: ":8081"
prometheus:
  enabled: true
  address: ":9090"
shutdown_timeout: 15s
logging: {level: warn}
