mode: gateway
grpc:
  address: ":8080"
health:
  address: ":8081"
prometheus:
  enabled: true
  address: ":9090"
gateway:
  routes: # Store routes are loaded only at startup; restart after changes.
    - store: primary
      target: dns:///engine:8080
      tls:
        insecure: true # Local Compose network; use TLS termination in production.
  dns_refresh_interval: 30s
  idle_timeout: 5m
  max_connections: 256
  max_requests: 128
  max_bytes: 256MiB
  max_fanout: 8
service:
  request:
    timeout: 30s
    max_operations: 1000
    max_read_bytes: 32MiB
