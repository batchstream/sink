mode: all

grpc:
  address: ":8080"
  max_receive_message_bytes: 67108864
  max_send_message_bytes: 67108864

prometheus:
  address: ":9090"

storages:
  - name: primary
    driver: mongodb
    mongodb:
      uri: mongodb://mongo:27017/?replicaSet=rs0
      max_concurrent_writes: 64
      max_concurrent_groups: 16
    kafka:
      enabled: true
      brokers:
        - kafka:19092
      topic:
        name: sink-mutations
        partitions: 4
        replication_factor: 1
        retention: 72h
      consumer:
        group_id: sink-quickstart
        max_poll_records: 500
        retry:
          max_attempts: 10
          backoff: 100ms
          max_backoff: 10s

      dead_letter:
        topic: sink-mutations.dlq
service:
  request:
    max_operations: 1000
  batching:
    max_wait: 2ms
    max_operations: 1000
    max_bytes: 16777216
    queue:
      max_operations: 10000
      max_bytes: 134217728
  merge:
    max_attempts: 3
    lua:
      timeout: 100ms
      max_source_bytes: 65536
      max_result_bytes: 16777216
      max_cached_programs: 256
      max_instructions: 1000000

shutdown_timeout: 15s
