syntax = "proto3";
package sink.forward.v1;
option go_package = "github.com/liran/sink/gen/forward;forward";

import "sink/sink.proto";
import "google/protobuf/any.proto";

// Private Gateway-to-Engine protocol. Never used by public clients.
service Engine {
  rpc Forward(ForwardRequest) returns (ForwardResponse);
}

// Independent logical document budgets, including per-record envelope charges.
message Budget {
  uint64 snapshots = 1;
  uint64 inputs = 2;
  uint64 outputs = 3;
  uint64 returns = 4;
}

message ForwardRequest {
  uint32 version = 1;
  string store = 2;
  string database_id = 3;
  Budget grant = 4;
  oneof request {
    sink.v1.ReadRequest read = 10;
    sink.v1.WriteRequest write = 11;
    sink.v1.DeleteRequest delete = 12;
    sink.v1.ExecuteRequest execute = 13;
    sink.v1.QueryRequest query = 14;
    sink.v1.CountRequest count = 15;
    sink.v1.ScanRequest scan = 16;
  }
}

message ForwardResponse {
  uint32 version = 1;
  string store = 2;
  string database_id = 3;
  Budget used = 4;
  // gRPC application status is carried inside the envelope so usage survives errors.
  uint32 code = 5;
  string message = 6;
  // True only when rejected before invoking the execution service.
  bool not_started = 7;
  repeated google.protobuf.Any status_details = 8;
  oneof response {
    sink.v1.ReadResponse read = 10;
    sink.v1.WriteResponse write = 11;
    sink.v1.DeleteResponse delete = 12;
    sink.v1.ExecuteResponse execute = 13;
    sink.v1.QueryResponse query = 14;
    sink.v1.CountResponse count = 15;
    sink.v1.ScanResponse scan = 16;
  }
}
