# Gateway routing table, referenced by config.gateway.example.yaml.
# Replace this complete file atomically; duplicate Store names are rejected.
routes: # Complete snapshot, at most 10000 routes and 4MiB; invalid reloads keep old data.
  - store: primary # Must match the Engine/Worker storage.name and public request Store.
    target: dns:///engine-primary:8080 # Required gRPC target for this Store's Engines.
    state: active # Default active; draining/disabled reject new calls, existing calls finish.
    tls: # Downstream transport; identity checks do not replace authentication.
      insecure: true # Example: trusted plaintext network. Default false requires a TLS endpoint/proxy.
      server_name: "" # Optional TLS name override; leave empty when insecure is true.

